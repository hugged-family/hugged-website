
steps:
  # ------------------------------------------------------------
  # 1. Build Docker image
  # ------------------------------------------------------------
  - name: gcr.io/cloud-builders/docker
    id: Build
    args:
      - build
      - '--no-cache'
      - '-t'
      - >-
        $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - .
      - '-f'
      - Dockerfile

  # ------------------------------------------------------------
  # 2. Push Docker image to Artifact Registry
  # ------------------------------------------------------------
  - name: gcr.io/cloud-builders/docker
    id: Push
    args:
      - push
      - >-
        $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA

  # ------------------------------------------------------------
  # 3. Deploy to Cloud Run
  # ------------------------------------------------------------
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Deploy
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - $_SERVICE_NAME
      - '--platform=managed'
      - >-
        --image=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - >-
        --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=$_TRIGGER_ID
      - '--region=$_DEPLOY_REGION'
      - '--quiet'

  # ------------------------------------------------------------
  # 4. Keep only the latest 2 Cloud Run revisions
  # ------------------------------------------------------------
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Cleanup-Old-Revisions
    entrypoint: bash
    args:
      - '-c'
      - |
        set -e

        echo "Checking Cloud Run revisions..."

        REVISIONS=$$(gcloud run revisions list \
          --service="$_SERVICE_NAME" \
          --region="$_DEPLOY_REGION" \
          --platform=managed \
          --sort-by="~metadata.creationTimestamp" \
          --format="value(metadata.name)")

        echo "All revisions:"
        echo "$$REVISIONS"

        OLD_REVISIONS=$$(echo "$$REVISIONS" | tail -n +3)

        if [ -z "$$OLD_REVISIONS" ]; then
          echo "Nothing to delete. There are 2 or fewer revisions."
          exit 0
        fi

        echo "Old revisions to delete:"
        echo "$$OLD_REVISIONS"

        while IFS= read -r REVISION; do
          if [ -n "$$REVISION" ]; then
            echo "Deleting revision: $$REVISION"

            gcloud run revisions delete "$$REVISION" \
              --region="$_DEPLOY_REGION" \
              --platform=managed \
              --quiet
          fi
        done <<< "$$OLD_REVISIONS"

        echo "Revision cleanup completed."

# --------------------------------------------------------------
# Image generated by this build
# --------------------------------------------------------------
images:
  - >-
    $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA

# --------------------------------------------------------------
# Build options
# --------------------------------------------------------------
options:
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY

# --------------------------------------------------------------
# Default substitutions
# --------------------------------------------------------------
substitutions:
  _AR_REPOSITORY: cloud-run-source-deploy
  _AR_PROJECT_ID: hugged-staging
  _PLATFORM: managed
  _SERVICE_NAME: hugged-web
  _DEPLOY_REGION: asia-southeast1
  _AR_HOSTNAME: asia-southeast1-docker.pkg.dev
  _TRIGGER_ID: YOUR_TRIGGER_ID

# --------------------------------------------------------------
# Build tags
# --------------------------------------------------------------
tags:
  - gcp-cloud-build-deploy-cloud-run
  - gcp-cloud-build-deploy-cloud-run-managed
  - hugged-web
